workflows:
  ios-unsigned-workflow:
    name: Build KMP iOS App (Unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      groups:
        - api_keys

    scripts:
      - name: Make Gradle Wrapper Executable
        script: chmod +x gradlew

      - name: Inject API Keys into local.properties
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> local.properties
          echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> local.properties

      - name: Configure Gradle Memory limits
        script: |
          echo "" >> gradle.properties 
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.native.jvmArgs=-Xmx3g" >> gradle.properties
          echo "kotlin.native.cacheKind=none" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties


      - name: Link iOS Alternate Icons to Xcode Project
        script: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          
          # 1. Open the Xcode project
          project_path = 'iosApp/iosApp.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # 2. Find the main app target and the folder group
          target = project.targets.find { |t| t.name == 'iosApp' } || project.targets.first
          group = project.main_group.find_subpath('iosApp', true)
          
          # 3. Define the exact names of your icon files
          icons = [
            'GoldIcon.png', 'StealthIcon.png', 'CyberIcon.png', 
            'SynthwaveIcon.png', 'IceIcon.png', 'ChampionshipIcon.png', 
            'CarbonIcon.png', 'AdrenalinIcon.png'
          ]
          
          # 4. Loop through and link them to the project
          icons.each do |icon|
            file_path = 'iosApp/iosApp/' + icon
            if File.exist?(file_path)
              # Create a reference to the file
              file_ref = group.find_file_by_path(icon) || group.new_reference(icon)
          
              # Add it to the 'Copy Bundle Resources' build phase so it gets packed into the app
              if target.resources_build_phase.files.none? { |f| f.file_ref == file_ref }
                target.resources_build_phase.add_file_reference(file_ref)
                puts 'Successfully linked: ' + icon
              end
            else
              puts 'WARNING: Could not find ' + file_path
            end
          end
          
          # 5. Save the modified Xcode project
          project.save
          puts 'Xcode project updated successfully!'
          "

      - name: Build Unsigned iOS App
        script: |
          set -e 

          # 1. Prepare Kotlin CocoaPods
          ./gradlew :shared:generateDummyFramework :shared:podspec

          # 2. Install Pods
          cd iosApp
          pod install
          cd ..

          # 3. Build the Workspace
          # Fix: PARALLELIZE_TARGETS=NO (no dash, uses equals sign)
          # Addition: -derivedDataPath to make finding the app easier
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build-xcode \
            PARALLELIZE_TARGETS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 4. Package the IPA
          # The app will now always be in this exact folder
          mkdir -p Payload
          cp -R build-xcode/Build/Products/Debug-iphoneos/MatchPoint.app Payload/
          zip -r KmpApp.ipa Payload

    artifacts:
      - KmpApp.ipa