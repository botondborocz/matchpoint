workflows:
  ios-unsigned-workflow:
    name: Build KMP iOS App (Unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      groups:
        - api_keys

    scripts:
      - name: Make Gradle Wrapper Executable
        script: chmod +x gradlew

      - name: Inject API Keys into local.properties
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> local.properties
          echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> local.properties

      - name: Configure Gradle Memory limits
        script: |
          echo "" >> gradle.properties 
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.native.jvmArgs=-Xmx3g" >> gradle.properties
          echo "kotlin.native.cacheKind=none" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties


      - name: Configure iOS 18 Alternate Icons in Xcode
        script: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          
          project_path = 'iosApp/iosApp.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'iosApp' } || project.targets.first
          
          # Define the exact names of your .appiconset folders (without the extension)
          alternate_icons = 'AdrenalinIcon ChampionshipIcon CyberIcon GoldIcon IceIcon IceIconExtra LightIcon StealthIcon SynthwaveIcon SynthwaveIconExtra'
          
          target.build_configurations.each do |config|
            # Tell Xcode to compile these as alternate icons
            config.build_settings['ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES'] = alternate_icons
            # Ensure it bundles them into the final app
            config.build_settings['ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS'] = 'YES'
          end
          
          project.save
          puts 'Successfully updated Xcode build settings for iOS 18 Alternate Icons!'
          "

      - name: Build Unsigned iOS App
        script: |
          set -e 

          # 1. Prepare Kotlin CocoaPods
          ./gradlew :shared:generateDummyFramework :shared:podspec

          # 2. Install Pods
          cd iosApp
          pod install
          cd ..

          # 3. Build the Workspace
          # Fix: PARALLELIZE_TARGETS=NO (no dash, uses equals sign)
          # Addition: -derivedDataPath to make finding the app easier
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build-xcode \
            PARALLELIZE_TARGETS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 4. Package the IPA
          # The app will now always be in this exact folder
          mkdir -p Payload
          cp -R build-xcode/Build/Products/Debug-iphoneos/MatchPoint.app Payload/
          zip -r KmpApp.ipa Payload

    artifacts:
      - KmpApp.ipa

  ios-unsigned-workflow-compose:
    name: Build KMP iOS App Compose (Unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      groups:
        - api_keys

    scripts:
      - name: Make Gradle Wrapper Executable
        script: chmod +x gradlew

      - name: Inject API Keys into local.properties
        script: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> local.properties
          echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> local.properties

      - name: Configure Gradle Memory limits
        script: |
          echo "" >> gradle.properties 
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "kotlin.native.jvmArgs=-Xmx3g" >> gradle.properties
          echo "kotlin.native.cacheKind=none" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Configure Xcode Project (Alternate Icons & Bundle ID)
        script: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          
          project_path = 'iosApp/iosApp.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Target the main app strictly (ignores Pods)
          target = project.targets.find { |t| t.name == 'iosApp' } || project.targets.first
          
          alternate_icons = 'AdrenalinIcon ChampionshipIcon CyberIcon GoldIcon IceIcon IceIconExtra LightIcon StealthIcon SynthwaveIcon SynthwaveIconExtra'
          
          target.build_configurations.each do |config|
            # 1. Set Alternate Icons
            config.build_settings['ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES'] = alternate_icons
            config.build_settings['ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS'] = 'YES'
            
            # 2. Safely Override Bundle Identifier & Name for side-by-side installation
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'org.ttproject.TTProjectCompose'
            config.build_settings['PRODUCT_NAME'] = 'MatchPoint Cmp'
            
            # 3. Explicitly set the Display Name (Home Screen Name) 
            config.build_settings['INFOPLIST_KEY_CFBundleDisplayName'] = 'MatchPoint Cmp'
          end
          
          project.save
          puts 'Successfully updated Xcode build settings for Alternate Icons, Bundle ID, and Display Name!'
          "

      - name: Build Unsigned iOS App (Compose)
        script: |
          set -e 

          # 1. Prepare Kotlin CocoaPods
          ./gradlew :shared:generateDummyFramework :shared:podspec

          # 2. Install Pods
          cd iosApp
          pod install
          cd ..

          # 3. Build the Workspace (No global overrides needed now)
          xcodebuild build \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build-xcode \
            PARALLELIZE_TARGETS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # 4. Package the IPA
          # The Ruby script changed the target PRODUCT_NAME, so the app file is now 'MatchPoint Cmp.app'
          mkdir -p Payload
          cp -R "build-xcode/Build/Products/Debug-iphoneos/MatchPoint Cmp.app" Payload/
          zip -r KmpAppCompose.ipa Payload

    artifacts:
      - KmpAppCompose.ipa